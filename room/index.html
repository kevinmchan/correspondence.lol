  <script>
    // Light or dark: the choice made in the profile menu, or else whatever the
    // device says. Set before anything is painted; kept up to date by
    // shared/profile.js.
    (function () {
      var choice = null;
      try { choice = JSON.parse(localStorage.getItem('correspondence:theme:v1')); } catch (e) {}
      var dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').content = dark ? '#161d24' : '#f6f1e7';
    })();
  </script>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/postmarks/postmarks.css">
  <link rel="stylesheet" href="/jam/jam.css">
  <link rel="stylesheet" href="/penny/story.css">
  <link rel="stylesheet" href="/penny/walk.css">
  <link rel="stylesheet" href="/penny/pal.css">
  <link rel="stylesheet" href="/jam/taste.css">
  <link rel="stylesheet" href="/penny/hello.css">
  <link rel="stylesheet" href="/penny/office.css">
  <link rel="stylesheet" href="/penny/slow.css">

  <link rel="stylesheet" href="/penny/sky.css">
  <link rel="stylesheet" href="/penny/tags.css">
  <link rel="stylesheet" href="/penny/reel.css">
  <link rel="stylesheet" href="/room/worlds.css">
  <link rel="stylesheet" href="/room/meadow.css">
  <link rel="stylesheet" href="/room/folk.css">
  <script>
    // The splash plays whenever the page is loaded on the home screen: opening
    // the app, a new tab, or a refresh. (Moving between screens inside the app
    // loads nothing, so it never plays then.) An address that opens a room, a
    // game or one of the other screens skips it, and so does anyone who has
    // asked their device for less motion.
    if ((location.pathname !== '/' && location.pathname !== '/index.html') || /[?&](open|join|penny|hello|walk|office|slow|sky)\b/.test(location.search) || matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('no-splash');
    }
  </script>
</head>
<body>
  <!--
    The whole app is this one page. Its screens are the templates below;
    shared/nav.js puts the right one on stage for the address and swaps them as
    people move about. /room/, /postmarks/ and /jam/ serve copies of this same file
    (npm run shell), so every address opens directly.
  -->
  <div id="splash" aria-hidden="true"><canvas></canvas></div>
  <div id="screens"></div>

  <template id="screen-home">
    <main>
      <svg class="mark" viewBox="0 0 512 512" width="80" height="80" role="img" aria-label="correspondence.lol">
        <rect class="tile" width="512" height="512" rx="112.6" fill="#22303c"/>
        <rect x="116" y="166" width="280" height="180" rx="14" fill="#f6f1e7"/>
        <path class="flap" d="M122 176 L256 276 L390 176" fill="none" stroke="#22303c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <circle class="ring" cx="256" cy="290" r="30" fill="none" stroke="#c8442e" stroke-width="10"/>
        <circle class="seal" cx="256" cy="290" r="30" fill="#c8442e"/>
      </svg>
      <h1>correspondence<span>.lol</span></h1>

      <!-- Still being built: a stamp in the top left corner, a sleepy cone on it, breathing, and the words. Nothing to press. -->
      <p id="building" class="building">
        <svg viewBox="22 12 76 96" aria-hidden="true">
          <text class="z" x="72" y="34">z</text><text class="z two" x="72" y="34">z</text><text class="z three" x="72" y="34">z</text>
          <g class="cone">
            <path class="cone-body" d="M38 98 L54 30 Q60 21 66 30 L82 98 Z"/>
            <path class="cone-stripes" d="M46.5 74 H73.5 M43 88 H77"/>
            <path class="cone-eyes" d="M51 56 q3 2.8 6 0 M63 56 q3 2.8 6 0"/>
            <path class="cone-cheeks" d="M50 63 h0.01 M70 63 h0.01"/>
            <rect class="cone-foot" x="30" y="97" width="60" height="7" rx="3.5"/>
          </g>
        </svg>
        <span class="building-words">under construction</span>
      </p>

      <!-- Who this device is: a face in the top right corner, and nothing written beside it. -->
      <section id="me" class="me-corner" aria-label="Your account" hidden>
        <button type="button" id="me-edit" class="profile-button" aria-label="Edit your profile" title="Edit your profile"></button>
        <span class="sr-only"><strong id="me-name"></strong> <span id="me-kind"></span></span>
      </section>

      <div class="stack">
        <!-- Play: one wide button, before anything else on the page. A board of your own, at once (postmarks/ui.js). -->
        <a href="/postmarks/" id="play" class="play-wide" aria-label="Play" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z" fill="currentColor"/></svg></a>
        <!-- Energy, everything earned in every game: one bar, about twenty games long (shared/energy.js), and at its end
             what the first bar is for, the meadow (shared/meadow.js), still in grey until it is full. Once it is yours, the
             meadow is a toggle: a room wears it, or not. No number, and no words: what is held is said to screen readers. -->
        <div id="home-energy" class="home-energy" hidden>
          <p id="home-bar" class="energy" role="img"><span class="bar" aria-hidden="true"><i></i></span></p>
          <button type="button" id="meadow" class="meadow-mark" aria-label="The meadow" aria-pressed="false" disabled>
            <svg viewBox="0 0 40 40" aria-hidden="true"><use href="#meadow-glimpse"/></svg>
          </button>
        </div>

        <!-- Two tabs: what is waiting on you, and everything else. -->
        <div id="tabs" class="tabs" role="tablist" aria-label="Home" hidden>
          <button type="button" role="tab" id="tab-feed" class="tab" aria-controls="panel-feed" aria-selected="false" style="--tile: #f8d95a">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 13.5h6L10 21l9-11.5h-6z"/></svg>
            <span>Feed</span><b id="feed-count" class="pip" hidden></b>
          </button>
          <button type="button" role="tab" id="tab-lobby" class="tab" aria-controls="panel-lobby" aria-selected="true" style="--tile: #9ad3f7">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5L12 4.5l8 7M6.5 10v9.5h11V10"/></svg>
            <span>Lobby</span>
          </button>
        </div>

        <section id="panel-feed" class="stack" role="tabpanel" aria-labelledby="tab-feed" hidden>
          <ul id="feed" class="feed"></ul>
          <div id="feed-empty" class="feed-empty" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#mini-envelope"/></svg>
            <strong>All clear</strong>
            <span id="feed-empty-note">Nothing is waiting on you.</span>
          </div>
        </section>

        <div id="panel-lobby" class="stack" role="tabpanel" aria-labelledby="tab-lobby">
        <section id="welcome" class="stack" hidden aria-label="Set up your account">
          <p id="welcome-note" class="hint" hidden>You’re signed out on this device.</p>
          <form id="welcome-new" class="card">
            <fieldset>
              <legend>New player</legend>
              <label class="field">
                <span>Your name</span>
                <input type="text" id="welcome-name" maxlength="20" required autocomplete="off">
              </label>
              <button type="submit">Start playing</button>
              <p id="welcome-new-error" class="message bad" role="alert"></p>
            </fieldset>
          </form>
          <form id="welcome-code" class="card">
            <fieldset>
              <legend>Returning player</legend>
              <label class="field">
                <span>Account code from your other device (there: tap your avatar, then Get account code)</span>
                <input type="text" id="welcome-code-text" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
              </label>
              <button type="submit">Sync account</button>
              <p id="welcome-code-note" class="message bad" role="alert"></p>
            </fieldset>
          </form>
        </section>

        <!-- Each room is a building on the map: its roof, in its colour, among the others (home.js, room/room.css). -->
        <div id="rooms" class="stack" hidden>
          <h2 class="sr-only">Your rooms</h2>
          <ul class="street"></ul>
        </div>

        <nav id="menu" class="menu" aria-label="Play" hidden>
          <a href="/?open" id="menu-open" class="menu-button" style="--tile: #f08a76">
            <span class="tile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg></span>
            <span class="words"><strong>Open a room</strong></span>
          </a>
          <a href="/?join" id="menu-join" class="menu-button" style="--tile: #9ad3f7">
            <span class="tile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15.5" r="4"/><path d="M11 12.5L20 3.5M16.5 7l2.5 2.5M14 9.5l2 2"/></svg></span>
            <span class="words"><strong>Join a room</strong></span>
          </a>
          <a href="/jam/" class="menu-button" style="--tile: #f3b3e6">
            <span class="tile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.8" cy="17.5" r="2.2"/><circle cx="16.8" cy="15.5" r="2.2"/></svg></span>
            <span class="words"><strong>Liv Radio</strong></span>
          </a>
          <!-- (Reels has Museum's place for now, the owner, 27 November 2026; the museum is still reached through Liv Radio's radio) -->
          <a href="/reels/marcus/" id="menu-reels" class="menu-button" style="--tile: #c9b8f0">
            <span class="tile" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.6"/><path d="M10.5 9.2v5.6l4.5-2.8z"/></svg></span>
            <span class="words"><strong>Reels</strong></span>
          </a>
        </nav>
        </div>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>
      <p id="version" class="version"></p>
      <!-- The page is a map seen from very far up, and one place is marked on it, at the foot of the page where Penny stands: the portal Penny wants to take you through (penny/walk.js). It itself is not on the page: see penny/pal.js. -->
      <div class="map-far home-map" aria-hidden="true"></div>
      <a href="/?hello" id="portal" class="portal home-portal" aria-label="The story, from the beginning"></a>
    </main>
  </template>

  <template id="screen-open">
    <header class="topbar">
      <a href="/" class="home-link" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5.5M11 6l-6 6 6 6"/></svg></a>
    </header>

    <main>
      <!-- Opening a room is choosing a plot on the map: staked out, with a board planted in it to write the name on (room/room.css). Nothing on it is written: the plot and the board say it. -->
      <h1 class="sign sr-only">Open a room</h1>
      <div class="plot">
        <div class="map-far plot-map" aria-hidden="true"></div>
        <div class="plot-path" aria-hidden="true"></div>
        <div class="lot">
          <span class="lot-lines" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <p id="open-how" class="sr-only">A place for you and your friends to play.</p>
          <form id="create-room" class="card stack placard">
            <fieldset>
              <label class="field">
                <span class="sr-only">Room name</span>
                <input type="text" id="room-name" maxlength="24" placeholder="room name…" autocomplete="off" enterkeyhint="go" aria-describedby="open-how" required>
              </label>
              <button type="submit" class="icon-button"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg><span class="sr-only">Open room</span></button>
              <p id="create-error" class="message bad" role="alert"></p>
            </fieldset>
          </form>
        </div>
      </div>
    </main>
  </template>

  <template id="screen-join">
    <header class="topbar">
      <a href="/" class="home-link" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5.5M11 6l-6 6 6 6"/></svg></a>
    </header>

    <main>
      <!-- Joining is finding a door by its code: a building with its roof on, and the mat at its door to write the code on. -->
      <h1 class="sign sr-only">Join a room</h1>
      <div class="plot">
        <div class="map-far plot-map" aria-hidden="true"></div>
        <div class="plot-path" aria-hidden="true"></div>
        <div class="outside">
          <div class="roof-big" aria-hidden="true"></div>
          <form id="join-room" class="card stack mat">
            <fieldset>
              <p id="join-how" class="sr-only">Ask a friend in the room for its code.</p>
              <label class="field">
                <span class="sr-only">Room code</span>
                <!-- (no example in it, only the shape of a code, three and three, as it is written on every room's mat) -->
                <input type="text" id="join-code" class="code-input" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="•••-•••" enterkeyhint="go" aria-describedby="join-how" required>
              </label>
              <button type="submit" class="icon-button"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h3.5A1.5 1.5 0 0 1 19 5.5v13a1.5 1.5 0 0 1-1.5 1.5H14M4 12h10M10 8l4 4-4 4"/></svg><span class="sr-only">Join room</span></button>
              <p id="join-error" class="message bad" role="alert"></p>
            </fieldset>
          </form>
        </div>
      </div>
    </main>
  </template>

  <template id="screen-room">
    <header class="topbar">
      <a href="/" class="home-link" aria-label="Home"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5.5M11 6l-6 6 6 6"/></svg></a>
      <div class="top-actions">
        <!-- Two worlds (room/worlds.js): a portal, a ring of light like the home page's, into the room's other self (the same room as a drama at night), and from there the way back. Every visit starts outside. -->
        <button type="button" id="worlds" class="portal worlds-portal" aria-label="The other world" aria-pressed="false" hidden></button>
        <div class="more-wrap">
          <button type="button" id="more" class="quiet round" aria-label="Room options" aria-haspopup="true" aria-expanded="false" aria-controls="more-menu" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="18.5" cy="12" r="1.8" fill="currentColor"/></svg>
          </button>
          <div id="more-menu" class="pop-menu" role="menu" hidden>
            <!-- (a pencil, and a door with the way out of it, each with its word: the owner's choice, 25 November 2026) -->
            <button type="button" id="rename" role="menuitem" aria-label="Rename room"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5l4 4M4.5 19.5l1-4.5L15.8 4.7a1.8 1.8 0 0 1 2.5 0l1 1a1.8 1.8 0 0 1 0 2.5L9 18.5z"/></svg><span aria-hidden="true">Rename</span></button>
            <button type="button" id="leave" role="menuitem" class="danger" aria-label="Leave room"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H6.5A1.5 1.5 0 0 0 5 5.5v13A1.5 1.5 0 0 0 6.5 20H10M20 12H10M16 8l4 4-4 4"/></svg><span aria-hidden="true">Leave</span></button>
          </div>
        </div>
        <button type="button" id="profile" class="profile-button" aria-label="Your profile" hidden></button>
      </div>
    </header>

    <main>
      <!--
        A room is a building on the map, seen from above like everything else
        here, with its roof off (room/room.css). Its name is the map's label
        for it. Inside: the people in it, as tokens at the head of a table; the
        games, laid on the table as small boards; three tiles to start a game
        from; the chat, as notes passed across a rug; and at the door the mat,
        which has the code friends join with, and the bell.

        It is a quiet room. Only what is waiting on you is lit: its board lies
        nearest, bright, under a lamp, with its seal breathing. Everything else
        rests. Nothing here is a description: the room says what it is by its
        form, and the words are kept for screen readers. (What went wrong is
        said in a short line of words beside it, while it stands.)
      -->
      <h1 id="room-name" class="sign" aria-busy="true"></h1>
      <div class="plot">
        <!-- (what went wrong with the name lies under it, over the top of the building, which does not move for it) -->
        <p id="name-error" class="message bad" role="alert"></p>
        <div class="map-far plot-map" aria-hidden="true"></div>
        <div class="plot-path" aria-hidden="true"></div>
        <p id="loading" class="lede" role="status"><span class="sr-only">Opening room…</span></p>
        <p id="room-error" class="message bad" role="alert"></p>

        <!-- Seen by somebody who is not in it: the same building, as it is inside, so that somebody sent a link knows the place when
             they are in it. Its table, with whoever is in at the head of it, each with their name, and a board on it; and at the door the
             mat, where whoever has come stands: the face they will go in with, their name to write beside it, and the way in. -->
        <div id="join" class="outside" hidden>
          <div class="house peek">
            <div class="house-floor" aria-hidden="true"></div>
            <div class="house-walls" aria-hidden="true"></div>
            <div class="inside">
              <span id="join-faces" class="seats" aria-hidden="true"></span>
              <span id="join-table" class="peek-table" aria-hidden="true"></span>
              <form id="join-form" class="card mat">
                <p id="join-text" class="sr-only"></p>
                <div>
                  <span id="join-you" class="avatar" aria-hidden="true"></span>
                  <label class="field">
                    <span class="sr-only">Your name</span>
                    <input type="text" id="join-name" maxlength="20" placeholder="your name…" required autocomplete="off" aria-describedby="join-text">
                  </label>
                  <button type="submit" class="icon-button"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h3.5A1.5 1.5 0 0 1 19 5.5v13a1.5 1.5 0 0 1-1.5 1.5H14M4 12h10M10 8l4 4-4 4"/></svg><span class="sr-only">Join room</span></button>
                </div>
                <p id="join-error" class="message bad" role="alert"></p>
              </form>
            </div>
            <span class="yard" aria-hidden="true"><i></i><i></i></span>
          </div>
        </div>

        <div id="house" class="house" hidden>
          <div class="house-floor" aria-hidden="true"></div>
          <div class="house-walls" aria-hidden="true"></div>
          <!-- The meadow, when the room wears it (shared/meadow.js, room/meadow.css): what grows and flies there, behind everything. -->
          <div class="meadow-bits" aria-hidden="true">
            <div class="ground"></div>
            <div class="clouds"><i></i><i></i></div>
            <div class="blooms"></div>
            <div class="tall one"><svg viewBox="0 0 22 46"><path class="stalk" d="M11 46C11 34 12 24 11 12"/><path class="leaf" d="M11 33C4 30 2 25 3 22C8 23 11 27 11 33Z"/><path class="leaf" d="M11.4 26C17 24 20 19 19.5 16C15 17 12 21 11.4 26Z"/><g class="petal"><circle cx="11" cy="4.2" r="4.2"/><circle cx="17.2" cy="8.8" r="4.2"/><circle cx="14.8" cy="15.6" r="4.2"/><circle cx="7.2" cy="15.6" r="4.2"/><circle cx="4.8" cy="8.8" r="4.2"/></g><circle class="heart" cx="11" cy="10.4" r="3.8"/></svg></div>
            <div class="tall two"><svg viewBox="0 0 22 46"><path class="stalk" d="M11 46C11 34 12 24 11 12"/><path class="leaf" d="M11 33C4 30 2 25 3 22C8 23 11 27 11 33Z"/><g class="petal"><circle cx="11" cy="4.2" r="4.2"/><circle cx="17.2" cy="8.8" r="4.2"/><circle cx="14.8" cy="15.6" r="4.2"/><circle cx="7.2" cy="15.6" r="4.2"/><circle cx="4.8" cy="8.8" r="4.2"/></g><circle class="heart" cx="11" cy="10.4" r="3.8"/></svg></div>
            <div class="sun"><svg viewBox="0 0 60 60">
              <circle class="disc day" cx="30" cy="30" r="24"/>
              <path class="disc night" d="M30.74 6.01A24 24 0 1 0 53.05 36.69A19 19 0 1 1 30.74 6.01Z"/>
              <g class="day"><circle class="cheek" cx="18.5" cy="35" r="4"/><circle class="cheek" cx="41.5" cy="35" r="4"/><path class="eye" d="M19.5 27.5q3-4 6 0M34.5 27.5q3-4 6 0"/><path class="mouth" d="M23 35.5q7 7 14 0"/></g>
              <g class="night"><path class="eye" d="M14 30.5q3 2.6 6 0M23.5 31q3 2.6 6 0"/><path class="mouth" d="M18 38.5q3.5 2.6 7 0"/></g>
            </svg></div>
            <div class="fly"><svg viewBox="-16 -14 32 28">

        <dialog id="taste-behind" class="behind reading" aria-labelledby="reading-title">
          <section class="taste-lab">
          <header class="entry">
            <p class="gallery-name">The Gallery of Kept Music</p>
            <h2 id="reading-title" tabindex="-1" autofocus><cite>Liv Radio</cite></h2>
            <p class="tombstone">Steel, enamel<br>Two stations, one listener<br>Anonymous loan</p>
          </header>
          <!-- The audio guide's stop: what Dot said for Penny, once Dot has said it. -->
          <figure id="dot-told" class="dot-told" hidden><svg viewBox="13 40 40 40" aria-hidden="true"><rect x="17" y="43" width="32" height="34" rx="3" fill="#2aa198"/><rect x="19.5" y="45.5" width="27" height="29" rx="1.5" fill="none" stroke="#f6f1e7" stroke-width="1.2" stroke-dasharray="0.1 2.6" stroke-linecap="round"/><circle cx="28" cy="58" r="1.9" fill="#22303c"/><circle cx="38" cy="58" r="1.9" fill="#22303c"/><path d="M30 63.5q3 2.6 6 0" fill="none" stroke="#22303c" stroke-width="1.6" stroke-linecap="round"/></svg><blockquote>“You’re part of an experiment.”</blockquote><figcaption><b>Audio guide</b> Dot, for Penny, who saw it first and had no words for it.</figcaption></figure>
          <p class="what">The tag on its side, in plain sight all along, is not the gallery’s: this radio is also an experiment. From the stations you keep, a model learns what you like, to see whether it can call your next choice.</p>
          <!-- The question the piece asks, in the exhibit's own words, and left open. -->
          <div class="asks">
            <p>The gallery keeps music for a world afraid of losing it, as taste is averaged ever more efficiently.</p>
            <p class="question">Is a radio that learns one person’s taste a defence of that taste, or one more step in the averaging?</p>
          </div>
          <!-- Where the experiment stands, and how it works: under a heading of its own, so that nothing after the question reads as its answer. -->
          <figure class="evidence">
            <h3>Where the test stands</h3>
            <div id="lab-meter" class="meter" role="img" aria-label="How far the stake has got towards ×20"><i></i></div>
            <figcaption id="lab-verdict" class="verdict"></figcaption>
          </figure>
          <dl>
            <div><dt>Picks</dt><dd id="lab-picks"></dd></div>
            <div><dt>Stake</dt><dd id="lab-stake"></dd></div>
            <div id="lab-carried-row" hidden><dt>Carried over, on starting over</dt><dd id="lab-carried"></dd></div>
            <div><dt>Called right by the model</dt><dd id="lab-called"></dd></div>
            <div><dt>Called right by habit alone</dt><dd id="lab-habits"></dd></div>
            <div><dt>Beat the phantoms</dt><dd id="lab-coin"></dd></div>
          </dl>
          <p id="lab-likes" class="likes"></p>
          <!-- The phantoms, drawn: the station kept, a challenger that is heard, and its twins, made with it and never heard: a stack of them. -->
          <figure class="phantom">
            <svg viewBox="0 0 300 72" aria-hidden="true">
              <path class="bracket" d="M150 15v-6h105v6M202.5 9V3"/>
              <g class="station kept"><rect x="20" y="18" width="70" height="44" rx="7"/><path class="notes" d="M32 48h8M46 38h8M60 30h8M74 42h4"/></g>
              <g class="station"><rect x="115" y="18" width="70" height="44" rx="7"/><path class="notes" d="M127 42h8M141 32h8M155 46h8M169 36h4"/></g>
              <g class="station unheard behind"><rect x="228" y="26" width="70" height="44" rx="7"/></g>
              <g class="station unheard behind"><rect x="224" y="22" width="70" height="44" rx="7"/></g>
              <g class="station unheard"><rect x="220" y="18" width="70" height="44" rx="7"/><path class="notes" d="M232 42h8M246 32h8M260 46h8M274 36h4"/></g>
            </svg>
            <figcaption><span>The station you kept<span class="sr-only">;</span></span><span>A challenger, heard<span class="sr-only">;</span></span><span>Its eight twins, never heard: the phantoms</span></figcaption>
          </figure>
          <details>
            <summary>How it works</summary>
            <p>Every station you keep is written down. A model learns from them what you go for: how fast, how busy each instrument is, how high the tune sits, and a dozen things more. From the tenth pick on it says in advance which station you will keep. What the model thinks never changes what the radio plays.</p>
            <p>Being called right is not proof of taste: someone who always keeps the station they already had is easy to call. So each time a challenger is needed, nine are made in the same way and eight are thrown away unheard, the phantoms. If the music made no difference to your picks, the real challenger would be no better a guide to them than any phantom. The model is asked about all nine before you pick, and a stake is bet on how much likelier your pick was with the real one.</p>
            <p>If the music made no difference, the stake would reach ×20 less than one time in twenty, however long you play and however often you look. So ×20 is significance at the 5% level, and there is no number of picks to decide beforehand.</p>
            <p>The meter on the radio is that stake, on a scale from ×1 to ×20 and a little past it; its lamp lights at ×20. It moves only after you keep a station, never while you choose, since what the model expects of the pair in front of you is not shown anywhere. Starting over carries the stake on, so that starting over never wipes out a loss: the experiments, one after another, are one test, so once the lamp has lit it stays lit, whatever the stake is carried at. Picks made before there were eight phantoms keep the rule they were made under.</p>
            <p>“Habit alone” is what can be called from which side of the dial a station is on, which one you already had, and which you heard first, knowing nothing about the music.</p>
          </details>
          <div class="taste-row end">
            <button type="button" id="taste-copy" class="quiet">Copy the data</button>
            <button type="button" id="taste-reset" class="quiet">Start over</button>
          </div>
          <button type="button" id="taste-again" class="quiet">Show me how again</button>
          </section>
          <!-- (always in reach, however far the reading has been scrolled) -->
          <footer class="sheet-foot"><button type="button" id="taste-behind-close" class="go">Back to the radio</button></footer>
        </dialog>
        <!-- The presets: part of what is played, not of the reading, so without words. The five lamps, as on the set, lit for the
             stations saved; and each station saved, as its picture and its place on the dial, to be opened in the music maker. What

  <template id="screen-slow">
    <!-- Scene two: what slow hands make. No words: see penny/slow.js. -->
    <main class="office slow">
      <a href="/" class="penny-back office-door" aria-label="Rooms and friends"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M3.5 21h17"/><circle cx="14.6" cy="12.5" r="0.9" fill="currentColor" stroke="none"/></svg></a>
      <p class="sr-only">Draw in the room with a finger, or with the arrow keys. What is drawn slowly stays, and grows; what is drawn fast fades. A finger held still opens a flower.</p>
      <svg class="office-stage penny-art" viewBox="0 0 200 300" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Penny, in the sorting room, now quiet, watching what you draw in the lamplight">
        <path class="o-lamp-light" d="M100 16 L20 262 L180 262 Z"/>
        <path class="o-lamp" d="M100 -600 V10 M92 16 q8 -9 16 0 z" stroke="#3b4d63" stroke-width="1.5"/>
        <g class="o-clock"><circle cx="66" cy="18" r="9"/><path d="M66 10.5v1.6M66 23.9v1.6M58.5 18h1.6M71.9 18h1.6" fill="none"/><path class="o-hand" d="M66 18V11.8" fill="none"/></g>
        <rect class="o-floor" x="-2000" y="262" width="4200" height="60"/>
      </svg>
      <canvas class="slow-keep" aria-hidden="true"></canvas>
      <canvas class="slow-pass" aria-hidden="true"></canvas>
      <i class="slow-tip" aria-hidden="true"></i>
      <button type="button" id="slow-portal" class="portal" aria-label="On, to the map" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#envelope"/></svg></button>
    </main>
  </template>

  <template id="screen-sky">
    <!-- The night: a picture of five lights, come to life. It is on no menu: it is a tag, hidden in the game, to be found (penny/tags.js). No words: see penny/sky.js. -->
    <main class="sky">
      <a href="/" class="penny-back" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5.5M11 6l-6 6 6 6"/></svg></a>
      <p class="sr-only">A picture of the night, come to life. Its five lights twinkle and wander, and each has a note. Touch one to hear it, or anywhere else and the nearest answers; a finger held near them stirs them. With a keyboard, the keys 1 to 5 are the five lights, and the space bar is each of them in turn.</p>
      <canvas class="sky-view" role="img" aria-label="Five dim lights on black. Three stars with four points fall in a line from the top left, each bigger than the last, with two small round lights beside them."></canvas>
      <p id="sky-said" class="sr-only" role="status"></p>
    </main>
  </template>

  <template id="screen-reel">
    <!-- A reel: Marcus Pell, an extension ladder, says something heartfelt, and then something else. Swipe up for each line: see penny/reel.js. -->
    <main class="reel" tabindex="-1" aria-label="A reel from marcus.pell. Swipe up, or press the down arrow, for each line.">
      <svg class="reel-scene" viewBox="0 0 360 640" preserveAspectRatio="xMidYMax slice" role="img" aria-label="An aluminium extension ladder with a friendly face films himself in a tidy home office. A chart on the wall shows one line climbing away from another."></svg>
      <a href="/" class="penny-back" aria-label="Back"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5.5M11 6l-6 6 6 6"/></svg></a>
      <div class="reel-rail">
        <span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 20.5l-1.4-1.3C5.4 14.6 2 11.5 2 7.8 2 4.8 4.4 2.5 7.4 2.5c1.7 0 3.4.8 4.6 2.1 1.2-1.3 2.9-2.1 4.6-2.1 3 0 5.4 2.3 5.4 5.3 0 3.7-3.4 6.8-8.6 11.4z"/></svg>48.1K</span>
        <span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3.5 11.5a8.5 8 0 1 1 4.2 6.9L3 20l1.4-4.3a7.8 7.8 0 0 1-.9-4.2z"/></svg>611</span>
        <!-- The one mark on the rail that does something: the phone's own share sheet, with the reel's address (penny/reel.js). -->
        <button type="button" id="reel-share" aria-label="Share"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 3L3 10.5l7 2.5 2.5 7z M10 13l5-5"/></svg><span aria-hidden="true">1,209</span></button>
      </div>
      <p id="reel-shared" class="reel-shared" role="status"></p>
      <!-- It begins with a tap: a phone lets sound start only on a tap, and a swipe is not one (penny/reel.js). -->
      <button type="button" id="reel-play" class="reel-play" aria-label="Play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.6v12.8a1 1 0 0 0 1.5.86l10.4-6.4a1 1 0 0 0 0-1.72L8.5 4.74a1 1 0 0 0-1.5.86z"/></svg></button>
      <div class="reel-low">
        <button type="button" id="reel-next" class="reel-next" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>Swipe up</button>
        <p id="reel-said" class="reel-said" aria-live="polite"></p>
        <p id="reel-comment" class="reel-comment" hidden><i aria-hidden="true"></i><span>Go get that paper boiiiii!</span></p>
        <p class="reel-who"><span class="reel-avatar" aria-hidden="true">MP</span><strong>marcus.pell</strong><span class="reel-follow" aria-hidden="true">Follow</span></p>
        <p id="reel-paid" class="reel-paid" hidden>Paid partnership with Penny’s Energy</p>
        <div id="reel-cap" class="reel-cap">
          <p>Real talk about who gets to climb 🪜<span class="reel-cap-dots"> …</span><span class="reel-cap-rest" hidden> Not everyone starts on the same rung. Stay humble, stay hungry, stay hydrated. <span class="reel-tags">#Gratitude #Mindset #StepByStep #RiseAndGrind</span> <span class="reel-ad">#ad</span></span></p>
          <button type="button" id="reel-more" aria-expanded="false">more</button>
        </div>
        <p class="reel-audio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17V5l10-2v12"/><circle cx="6.5" cy="17" r="2.5"/><circle cx="16.5" cy="15" r="2.5"/></svg>marcus.pell · Original audio</p>
      </div>
      <div class="reel-bar" aria-hidden="true"><i id="reel-progress"></i></div>
    </main>
  </template>

  <template id="screen-walk">
