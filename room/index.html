<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Room · correspondence.lol</title>
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161d24" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="page">
  <header class="topbar">
    <a href="/">← correspondence.lol</a>
    <button type="button" id="profile" class="profile-button" aria-label="Your profile" title="Your profile" hidden></button>
  </header>

  <main>
    <h1 id="room-name">Room</h1>
    <p id="loading" class="lede">Opening room…</p>

    <div id="join" class="stack" hidden>
      <p id="join-text" class="lede"></p>
      <form id="join-form" class="card">
        <label class="field">
          <span>Your name</span>
          <input type="text" id="join-name" maxlength="20" required autocomplete="off">
        </label>
        <button type="submit">Join room</button>
        <p id="join-error" class="message bad" role="alert"></p>
      </form>
    </div>

    <div id="compose" class="stack" hidden>
      <p class="lede">Pass phrase</p>
      <p class="hint">Leave a phrase for others to uncover.</p>
      <form id="phrase-form" class="card">
        <label class="field">
          <span>Your phrase</span>
          <input type="text" id="phrase-text" maxlength="60" autocomplete="off" spellcheck="false" placeholder="Leave empty for a random one">
        </label>
        <div id="tokens" class="phrase" aria-live="polite" aria-label="How your phrase will be hidden"></div>
        <p id="token-note" class="hint"></p>
        <button type="submit">Start game</button>
        <p id="phrase-error" class="message bad" role="alert"></p>
      </form>
      <button type="button" id="phrase-back" class="quiet">Back to the room</button>
    </div>

    <div id="room" class="stack" hidden>
      <ul id="members" class="people" aria-label="In this room"></ul>

      <div class="share">
        <label for="share-link">Send this link to invite people to the room</label>
        <div>
          <input type="text" id="share-link" readonly>
          <button type="button" id="copy-link">Copy</button>
          <button type="button" id="share-button" class="quiet" hidden>Share</button>
        </div>
      </div>

      <div id="notify" class="notify" hidden>
        <p id="notify-text"></p>
        <button type="button" id="notify-button"></button>
      </div>

      <section class="panel" aria-labelledby="games-heading">
        <h2 id="games-heading">Games</h2>
        <ul id="games" class="links"></ul>
        <p id="no-games" class="hint">No games yet.</p>
        <h2 id="new-heading">Start a new game</h2>
        <div id="modes" class="modes" role="group" aria-labelledby="new-heading">
          <button type="button" class="mode" data-mode="coop">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="8" r="3"/><circle cx="16.5" cy="9.5" r="2.4"/><path d="M2.8 19c.5-3.3 2.8-5.2 5.7-5.2s5.2 1.9 5.7 5.2M15.2 14.3c.4-.1.9-.2 1.3-.2 2.3 0 4.2 1.5 4.7 4.4"/></svg>
            <strong>Together</strong>
          </button>
          <button type="button" class="mode" data-mode="trial">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7"/><path d="M12 9.5v4l2.5 2M10 3h4M12 3v3.5M18.2 7.3l1.3-1.3"/></svg>
            <strong>Time trial</strong>
          </button>
          <button type="button" class="mode" data-mode="phrase">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15.5" r="4"/><path d="M11 12.5L20 3.5M16.5 7l2.5 2.5M14 9.5l2 2"/></svg>
            <strong>Pass phrase</strong>
          </button>
        </div>
        <p id="game-error" class="message bad" role="alert"></p>
      </section>

      <section class="panel" aria-labelledby="chat-heading">
        <h2 id="chat-heading">Chat</h2>
        <div id="chat"></div>
      </section>

      <button type="button" id="leave" class="quiet">Leave room</button>
      <p id="leave-error" class="message bad" role="alert"></p>
    </div>
  </main>

  <script type="module" src="/room/room.js"></script>
  <script src="/app.js" defer></script>
</body>
</html>
