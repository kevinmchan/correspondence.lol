<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>correspondence.lol</title>
  <meta name="description" content="Games played by turns, together. Open a room, invite your friends, play and chat.">
  <link rel="canonical" href="https://correspondence.lol/">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161d24" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Correspondence">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/postmarks/postmarks.css">
  <script>
    // The splash plays once per visit (per tab or app launch), and not at all
    // for anyone who has asked their device for less motion.
    // It belongs to the home screen: an address that opens a room or a game skips it.
    try {
      if ((location.pathname !== '/' && location.pathname !== '/index.html') || sessionStorage.getItem('correspondence:splash') || matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('no-splash');
      } else {
        sessionStorage.setItem('correspondence:splash', '1');
      }
    } catch (e) { /* no storage: it simply plays */ }
  </script>
</head>
<body>
  <!--
    The whole app is this one page. Its three screens are the templates below;
    shared/nav.js puts the right one on stage for the address and swaps them as
    people move about. /room/ and /postmarks/ serve copies of this same file
    (npm run shell), so every address opens directly.
  -->
  <div id="splash" aria-hidden="true"><canvas></canvas></div>
  <div id="screens"></div>

  <template id="screen-home">
    <main>
      <svg class="mark" viewBox="0 0 512 512" width="80" height="80" role="img" aria-label="correspondence.lol">
        <rect class="tile" width="512" height="512" rx="112.6" fill="#22303c"/>
        <rect x="116" y="166" width="280" height="180" rx="14" fill="#f6f1e7"/>
        <path class="flap" d="M122 176 L256 276 L390 176" fill="none" stroke="#22303c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <circle class="ring" cx="256" cy="290" r="30" fill="none" stroke="#c8442e" stroke-width="10"/>
        <circle class="seal" cx="256" cy="290" r="30" fill="#c8442e"/>
      </svg>
      <h1>correspondence<span>.lol</span></h1>
      <p class="lede">Games played by turns, together.</p>

      <div class="stack">
        <section id="me" class="card me" aria-label="Your account">
          <button type="button" id="me-edit" class="profile-button" aria-label="Edit your profile" title="Edit your profile"></button>
          <div class="who">
            <strong id="me-name"></strong>
            <span id="me-kind"></span>
          </div>
        </section>

        <section id="welcome" class="stack" hidden aria-label="Set up your account">
          <p id="welcome-note" class="hint" hidden>You’re signed out on this device.</p>
          <form id="welcome-new" class="card">
            <fieldset>
              <legend>New player</legend>
              <label class="field">
                <span>Your name</span>
                <input type="text" id="welcome-name" maxlength="20" required autocomplete="off">
              </label>
              <button type="submit">Start playing</button>
              <p id="welcome-new-error" class="message bad" role="alert"></p>
            </fieldset>
          </form>
          <form id="welcome-code" class="card">
            <fieldset>
              <legend>Returning player</legend>
              <label class="field">
                <span>Account code from your other device (there: tap your avatar, then Get account code)</span>
                <input type="text" id="welcome-code-text" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
              </label>
              <button type="submit">Sync account</button>
              <p id="welcome-code-note" class="message bad" role="alert"></p>
            </fieldset>
          </form>
        </section>

        <div id="rooms" class="stack" hidden>
          <h2>Your rooms</h2>
          <ul class="links"></ul>
        </div>

        <nav id="menu" class="menu" aria-label="Play" hidden>
          <button type="button" id="menu-open" class="menu-button" style="--tile: #f08a76">
            <span class="tile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg></span>
            <span class="words"><strong>Open a room</strong><small>For you and your friends</small></span>
          </button>
          <button type="button" id="menu-join" class="menu-button" style="--tile: #9ad3f7">
            <span class="tile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15.5" r="4"/><path d="M11 12.5L20 3.5M16.5 7l2.5 2.5M14 9.5l2 2"/></svg></span>
            <span class="words"><strong>Join a room</strong><small>With a friend’s code</small></span>
          </button>
          <a href="/postmarks/" class="menu-button" style="--tile: #f8d95a">
            <span class="tile" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#mini-envelope"/></svg></span>
            <span class="words"><strong>Play solo</strong><small>A Postmarks puzzle on your own</small></span>
          </a>
        </nav>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>
      <p id="version" class="version"></p>
      <!-- Two small residents of the bottom corner: Penny the letter and Dot the stamp. -->
      <div id="critters" class="critters" aria-hidden="true">
        <svg viewBox="0 0 132 84">
          <ellipse class="shade" cx="33" cy="78" rx="15" ry="3"/>
          <ellipse class="shade" cx="90" cy="78" rx="27" ry="3.5"/>
          <g class="dot">
            <g class="bob">
              <rect x="17" y="43" width="32" height="34" rx="3" fill="#2aa198"/>
              <rect class="perf" x="17" y="43" width="32" height="34" rx="3"/>
              <rect x="22.5" y="48.5" width="21" height="23" rx="1.5" fill="none" stroke="#f6f1e7" stroke-width="1.2" opacity="0.55"/>
              <g class="eyes"><circle cx="28" cy="58" r="1.9"/><circle cx="38" cy="58" r="1.9"/></g>
              <path class="mouth" d="M30 63.5 q3 2.6 6 0"/>
            </g>
          </g>
          <g class="penny">
            <g class="bob">
              <path class="foot" d="M76 76 q4 -4 8 0z"/><path class="foot" d="M96 76 q4 -4 8 0z"/>
              <rect x="60" y="32" width="60" height="42" rx="5" fill="#f6f1e7" stroke="#22303c" stroke-width="2.6"/>
              <path class="flap" d="M61.5 34 L90 55 L118.5 34"/>
              <circle class="cheek" cx="71" cy="62" r="3.4"/><circle class="cheek" cx="109" cy="62" r="3.4"/>
              <g class="eyes"><ellipse cx="78" cy="58" rx="2.3" ry="2.9"/><ellipse cx="102" cy="58" rx="2.3" ry="2.9"/></g>
              <path class="mouth" d="M86.5 65 q3.5 3 7 0"/>
              <circle class="seal" cx="90" cy="54.5" r="4.6"/>
            </g>
          </g>
        </svg>
      </div>
    </main>

    <dialog id="open-dialog" class="sheet" aria-labelledby="open-title">
      <form id="create-room" class="card">
        <h2 id="open-title" class="sheet-title">Open a room</h2>
        <label class="field" id="my-name-field">
          <span>Your name</span>
          <input type="text" id="my-name" maxlength="20" required autocomplete="off">
        </label>
        <label class="field">
          <span>Room name (optional)</span>
          <input type="text" id="room-name" maxlength="40" autocomplete="off" placeholder="e.g. Tuesday club">
        </label>
        <p id="create-error" class="message bad" role="alert"></p>
        <div class="row end">
          <button type="button" class="quiet" data-close>Cancel</button>
          <button type="submit">Open room</button>
        </div>
      </form>
    </dialog>

    <dialog id="join-dialog" class="sheet" aria-labelledby="join-title">
      <form id="join-room" class="card">
        <h2 id="join-title" class="sheet-title">Join a room</h2>
        <label class="field">
          <span>Room code, from a friend in the room</span>
          <input type="text" id="join-code" class="code-input" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC-123" required>
        </label>
        <p id="join-error" class="message bad" role="alert"></p>
        <div class="row end">
          <button type="button" class="quiet" data-close>Cancel</button>
          <button type="submit">Join room</button>
        </div>
      </form>
    </dialog>
  </template>

  <template id="screen-room">
    <header class="topbar">
      <a href="/">← correspondence.lol</a>
      <button type="button" id="profile" class="profile-button" aria-label="Your profile" title="Your profile" hidden></button>
    </header>

    <main>
      <h1 id="room-name">Room</h1>
      <p id="loading" class="lede">Opening room…</p>

      <div id="join" class="stack" hidden>
        <p id="join-text" class="lede"></p>
        <form id="join-form" class="card">
          <label class="field">
            <span>Your name</span>
            <input type="text" id="join-name" maxlength="20" required autocomplete="off">
          </label>
          <button type="submit">Join room</button>
          <p id="join-error" class="message bad" role="alert"></p>
          <p class="hint"><a id="join-sign-in" href="/">Already have an account on another device? Sync it</a></p>
        </form>
      </div>

      <div id="compose" class="stack" hidden>
        <p class="lede">Pass phrase</p>
        <p class="hint">Leave a phrase for others to uncover.</p>
        <form id="phrase-form" class="card">
          <label class="field">
            <span>Your phrase</span>
            <input type="text" id="phrase-text" maxlength="60" autocomplete="off" spellcheck="false" placeholder="Leave empty for a random one">
          </label>
          <div id="tokens" class="phrase" aria-live="polite" aria-label="How your phrase will be hidden"></div>
          <p id="token-note" class="hint"></p>
          <button type="submit">Start game</button>
          <p id="phrase-error" class="message bad" role="alert"></p>
        </form>
        <button type="button" id="phrase-back" class="quiet">Back to the room</button>
      </div>

      <div id="room" class="stack" hidden>
        <ul id="members" class="people" aria-label="In this room"></ul>

        <div class="share">
          <span id="share-label">Friends join this room with its code</span>
          <div>
            <button type="button" id="room-code" class="code" aria-describedby="share-label"></button>
            <button type="button" id="share-button" class="quiet" hidden>Share</button>
          </div>
        </div>

        <div id="notify" class="notify" hidden>
          <p id="notify-text"></p>
          <button type="button" id="notify-button"></button>
        </div>

        <section class="panel" aria-labelledby="games-heading">
          <h2 id="games-heading">Games</h2>
          <ul id="games" class="links"></ul>
          <p id="no-games" class="hint">No games yet.</p>
          <h2 id="new-heading">Start a new game</h2>
          <div id="modes" class="modes" role="group" aria-labelledby="new-heading">
            <button type="button" class="mode" data-mode="coop">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="8" r="3"/><circle cx="16.5" cy="9.5" r="2.4"/><path d="M2.8 19c.5-3.3 2.8-5.2 5.7-5.2s5.2 1.9 5.7 5.2M15.2 14.3c.4-.1.9-.2 1.3-.2 2.3 0 4.2 1.5 4.7 4.4"/></svg>
              <strong>Together</strong>
            </button>
            <button type="button" class="mode" data-mode="trial">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7"/><path d="M12 9.5v4l2.5 2M10 3h4M12 3v3.5M18.2 7.3l1.3-1.3"/></svg>
              <strong>Time trial</strong>
            </button>
            <button type="button" class="mode" data-mode="phrase">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15.5" r="4"/><path d="M11 12.5L20 3.5M16.5 7l2.5 2.5M14 9.5l2 2"/></svg>
              <strong>Pass phrase</strong>
            </button>
          </div>
          <p id="game-error" class="message bad" role="alert"></p>
        </section>

        <section class="panel" aria-labelledby="chat-heading">
          <h2 id="chat-heading">Chat</h2>
          <div id="chat"></div>
        </section>

        <button type="button" id="leave" class="quiet">Leave room</button>
        <p id="leave-error" class="message bad" role="alert"></p>
      </div>
    </main>
  </template>

  <template id="screen-game">
    <header class="topbar">
      <a id="back" href="/">← correspondence.lol</a>
      <div class="top-actions">
        <div class="sound-wrap">
          <button type="button" id="sound" class="quiet round" aria-label="Sound" title="Sound" aria-haspopup="true" aria-expanded="false" aria-controls="sound-menu">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4H4z"/><path class="waves" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path class="slash" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
          </button>
          <div id="sound-menu" class="sound-menu" role="group" aria-label="Sound" hidden>
            <label class="setting"><span>Sound effects</span><input type="checkbox" role="switch" id="sound-fx"></label>
            <label class="setting"><span>Music</span><input type="checkbox" role="switch" id="sound-music"></label>
          </div>
        </div>
        <button type="button" id="help" class="quiet round" aria-label="How to play" title="How to play">?</button>
        <button type="button" id="share-game" class="quiet round" aria-label="Share this game" title="Share this game" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3.5M8 7l4-4 4 4M7 10.5H5.5v9.5h13v-9.5H17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" id="profile" class="profile-button" aria-label="Your profile" title="Your profile" hidden></button>
      </div>
    </header>

    <main>
      <h1>Postmarks</h1>
      <p id="loading" class="lede" hidden>Opening game…</p>

      <div id="trial" class="stack" hidden>
        <p id="trial-title" class="lede">Time trial</p>
        <p id="trial-hint" class="hint"></p>
        <div id="trial-phrase" class="phrase" hidden></div>
        <ol id="trial-runs" class="runs"></ol>
        <div class="row">
          <button type="button" id="trial-start" class="go">Start</button>
          <button type="button" id="trial-share" class="quiet">Share this game</button>
        </div>
        <p id="trial-error" class="message bad" role="alert"></p>
      </div>

      <div id="play" class="stack" hidden>
        <div class="hud">
          <p id="turn" class="turn"></p>
          <p class="tallies">
            <span id="hearts"></span>
            <span id="found"></span>
          </p>
        </div>

        <ul id="roster" class="people roster" aria-label="Players" hidden></ul>

        <div id="phrase" class="phrase" hidden></div>
        <p id="phrase-note" class="hint" hidden></p>

        <div id="board" class="board" role="group" aria-label="Puzzle grid"></div>

        <div class="toolbar">
          <div id="tools" class="tools" role="radiogroup" aria-label="What your turn does">
            <button type="button" role="radio" data-tool="mark" aria-checked="true" aria-label="Cross" title="Cross">
              <span class="glyph" aria-hidden="true">×</span>
            </button>
            <button type="button" role="radio" data-tool="guess" aria-checked="false" aria-label="Post" title="Post">
              <svg class="glyph" aria-hidden="true" viewBox="0 0 24 24"><use href="#envelope"/></svg>
            </button>
            <button type="button" role="radio" data-tool="phrase" aria-checked="false" hidden>
              <span class="glyph" aria-hidden="true">Aa</span> Phrase
            </button>
          </div>
          <button type="button" id="submit" class="go" disabled hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Submit
          </button>
        </div>
        <form id="phrase-entry" class="row phrase-entry" hidden>
          <input type="text" id="phrase-input" maxlength="60" autocomplete="off" autocapitalize="off" spellcheck="false"
                 placeholder="Type the whole phrase" aria-label="Your guess at the phrase" required>
          <button type="submit">Guess</button>
        </form>
        <p id="narration" class="sr-only" role="status" aria-live="polite"></p>
        <p id="message" class="message bad" role="alert"></p>

        <button type="button" id="new-game" class="quiet">New game</button>
        <ol id="runs" class="runs" hidden></ol>

        <details id="chat-box" class="panel" hidden>
          <summary>Room chat <span id="chat-unread"></span></summary>
          <div id="chat"></div>
        </details>
      </div>

    </main>
  </template>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="mini-envelope" viewBox="0 0 24 24">
      <rect x="3" y="6" width="18" height="12.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M3.8 7 L12 13.2 L20.2 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="envelope" viewBox="0 0 24 24">
      <rect x="2.5" y="5" width="19" height="14" rx="1.6" fill="#f6f1e7" stroke="#22303c" stroke-width="1.6"/>
      <path d="M3.2 6 L12 13 L20.8 6" fill="none" stroke="#22303c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="14.2" r="2.3" fill="#c8442e"/>
    </symbol>
  </svg>

  <script src="/version.js"></script>
  <script src="/app.js"></script>
  <script src="/splash.js"></script>
  <script type="module" src="/shared/nav.js"></script>
</body>
</html>
