<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>correspondence.lol</title>
  <meta name="description" content="Games played by turns, together. Open a room, invite your friends, play and chat.">
  <link rel="canonical" href="https://correspondence.lol/">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161d24" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Correspondence">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <img class="mark" src="/icons/icon.svg" alt="" width="80" height="80">
    <h1>correspondence<span>.lol</span></h1>
    <p class="lede">Games played by turns, together.</p>

    <div class="stack">
      <div id="rooms" class="stack" hidden>
        <h2>Your rooms</h2>
        <ul class="links"></ul>
      </div>

      <form id="create-room" class="card">
        <fieldset>
          <legend>Open a room for you and your friends</legend>
          <label class="field">
            <span>Your name</span>
            <input type="text" id="my-name" maxlength="20" required autocomplete="off">
          </label>
          <label class="field">
            <span>Room name (optional)</span>
            <input type="text" id="room-name" maxlength="40" autocomplete="off" placeholder="e.g. Tuesday club">
          </label>
          <button type="submit">Create room</button>
          <p id="create-error" class="message bad" role="alert"></p>
        </fieldset>
      </form>

      <h2>On your own?</h2>
      <ul class="links">
        <li><a href="/postmarks/"><strong>Postmarks</strong><span>A logic puzzle — play a game by yourself</span></a></li>
      </ul>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </div>
    <p id="version" class="version"></p>
  </main>
  <script src="/version.js"></script>
  <script type="module" src="/home.js"></script>
  <script src="/app.js" defer></script>
</body>
</html>
