<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>correspondence.lol</title>
  <meta name="description" content="Open a room, invite your friends, play and chat.">
  <link rel="canonical" href="https://correspondence.lol/">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#f6f1e7">
  <script>
    // Light or dark: the choice made in the profile menu, or else whatever the
    // device says. Set before anything is painted; kept up to date by
    // shared/profile.js.
    (function () {
      var choice = null;
      try { choice = JSON.parse(localStorage.getItem('correspondence:theme:v1')); } catch (e) {}
      var dark = choice === 'dark' || (choice !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.querySelector('meta[name="theme-color"]').content = dark ? '#161d24' : '#f6f1e7';
    })();
  </script>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Correspondence">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/postmarks/postmarks.css">
  <link rel="stylesheet" href="/jam/jam.css">
  <link rel="stylesheet" href="/penny/story.css">
  <link rel="stylesheet" href="/penny/walk.css">
  <link rel="stylesheet" href="/penny/pal.css">
  <link rel="stylesheet" href="/penny/office.css">
  <script>
    // The splash plays whenever the page is loaded on the home screen: opening
    // the app, a new tab, or a refresh. (Moving between screens inside the app
    // loads nothing, so it never plays then.) An address that opens a room, a
    // game or one of the other screens skips it, and so does anyone who has
    // asked their device for less motion.
    // Nor does it play before the film, which is what the bare address opens
    // on until the film so far has been seen through (shared/nav.js).
    var film = false;
    try { film = !location.search && !location.hash && localStorage.getItem('penny:walked:v1') !== 'true'; } catch (e) {}
    if (film || (location.pathname !== '/' && location.pathname !== '/index.html') || /[?&](open|join|penny|walk|office)\b/.test(location.search) || matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.documentElement.classList.add('no-splash');
    }
  </script>
</head>
<body>
  <!--
    The whole app is this one page. Its three screens are the templates below;
    shared/nav.js puts the right one on stage for the address and swaps them as
    people move about. /room/, /postmarks/ and /jam/ serve copies of this same file
    (npm run shell), so every address opens directly.
  -->
  <div id="splash" aria-hidden="true"><canvas></canvas></div>
  <div id="screens"></div>

  <template id="screen-home">
    <main>
      <svg class="mark" viewBox="0 0 512 512" width="80" height="80" role="img" aria-label="correspondence.lol">
        <rect class="tile" width="512" height="512" rx="112.6" fill="#22303c"/>
        <rect x="116" y="166" width="280" height="180" rx="14" fill="#f6f1e7"/>
        <path class="flap" d="M122 176 L256 276 L390 176" fill="none" stroke="#22303c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <circle class="ring" cx="256" cy="290" r="30" fill="none" stroke="#c8442e" stroke-width="10"/>
        <circle class="seal" cx="256" cy="290" r="30" fill="#c8442e"/>
      </svg>
      <h1>correspondence<span>.lol</span></h1>

      <div class="stack">
        <section id="me" class="card me" aria-label="Your account">
          <button type="button" id="me-edit" class="profile-button" aria-label="Edit your profile" title="Edit your profile"></button>
          <div class="who">
            <strong id="me-name"></strong>
            <span id="me-kind"></span>
          </div>
        </section>

        <section id="welcome" class="stack" hidden aria-label="Set up your account">
          <p id="welcome-note" class="hint" hidden>You’re signed out on this device.</p>
          <form id="welcome-new" class="card">
            <fieldset>
              <legend>New player</legend>
              <label class="field">
                <span>Your name</span>
                <input type="text" id="welcome-name" maxlength="20" required autocomplete="off">
              </label>
              <button type="submit">Start playing</button>
              <p id="welcome-new-error" class="message bad" role="alert"></p>
            </fieldset>
          </form>
          <form id="welcome-code" class="card">
            <fieldset>
              <legend>Returning player</legend>
              <label class="field">
                <span>Account code from your other device (there: tap your avatar, then Get account code)</span>
                <input type="text" id="welcome-code-text" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
              </label>
              <button type="submit">Sync account</button>
              <p id="welcome-code-note" class="message bad" role="alert"></p>
            </fieldset>
          </form>
        </section>

        <div id="rooms" class="stack" hidden>
          <h2>Your rooms</h2>
          <ul class="links"></ul>
        </div>

        <nav id="menu" class="menu" aria-label="Play" hidden>
          <a href="/?open" id="menu-open" class="menu-button" style="--tile: #f08a76">
            <span class="tile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg></span>
            <span class="words"><strong>Open a room</strong></span>
          </a>
          <a href="/?join" id="menu-join" class="menu-button" style="--tile: #9ad3f7">
            <span class="tile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15.5" r="4"/><path d="M11 12.5L20 3.5M16.5 7l2.5 2.5M14 9.5l2 2"/></svg></span>
            <span class="words"><strong>Join a room</strong></span>
          </a>
          <a href="/postmarks/" class="menu-button" style="--tile: #f8d95a">
            <span class="tile" aria-hidden="true"><svg viewBox="0 0 24 24"><use href="#mini-envelope"/></svg></span>
            <span class="words"><strong>Play solo</strong></span>
          </a>
          <a href="/jam/" class="menu-button" style="--tile: #f3b3e6">
            <span class="tile" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.8" cy="17.5" r="2.2"/><circle cx="16.8" cy="15.5" r="2.2"/></svg></span>
            <span class="words"><strong>Make music</strong></span>
          </a>
        </nav>

        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>
      <p id="version" class="version"></p>
      <!-- The page is a map seen from very far up, and one place is marked on it: the portal Penny wants to take you through (penny/walk.js). It itself is not on the page: see penny/pal.js. -->
      <div class="map-far home-map" aria-hidden="true"></div>
      <a href="/?walk" id="portal" class="portal home-portal" aria-label="Walk the map with Penny"></a>
    </main>
  </template>

  <template id="screen-open">
    <header class="topbar">
      <a href="/">← correspondence.lol</a>
    </header>

    <main>
      <span class="hero-tile" style="--tile: #f08a76" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5.5v13M5.5 12h13"/></svg></span>
      <h1>Open a room</h1>
      <p class="lede">A place for you and your friends to play.</p>
      <form id="create-room" class="card stack">
        <fieldset>
          <label class="field">
            <span>Room name</span>
            <input type="text" id="room-name" maxlength="40" autocomplete="off" enterkeyhint="go" placeholder="e.g. Tuesday club" required>
          </label>
          <button type="submit">Open room</button>
          <p id="create-error" class="message bad" role="alert"></p>
        </fieldset>
      </form>
    </main>
  </template>

  <template id="screen-join">
    <header class="topbar">
      <a href="/">← correspondence.lol</a>
    </header>

    <main>
      <span class="hero-tile" style="--tile: #9ad3f7" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15.5" r="4"/><path d="M11 12.5L20 3.5M16.5 7l2.5 2.5M14 9.5l2 2"/></svg></span>
      <h1>Join a room</h1>
      <p class="lede">Ask a friend in the room for its code.</p>
      <form id="join-room" class="card stack">
        <fieldset>
          <label class="field">
            <span>Room code</span>
            <input type="text" id="join-code" class="code-input" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC-123" enterkeyhint="go" required>
          </label>
          <button type="submit">Join room</button>
          <p id="join-error" class="message bad" role="alert"></p>
        </fieldset>
      </form>
    </main>
  </template>

  <template id="screen-room">
    <header class="topbar">
      <a href="/">← correspondence.lol</a>
      <div class="top-actions">
        <div class="more-wrap">
          <button type="button" id="more" class="quiet round" aria-label="Room options" title="Room options" aria-haspopup="true" aria-expanded="false" aria-controls="more-menu" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="18.5" cy="12" r="1.8" fill="currentColor"/></svg>
          </button>
          <div id="more-menu" class="pop-menu" role="menu" hidden>
            <button type="button" id="rename" role="menuitem">Rename room</button>
            <button type="button" id="leave" role="menuitem" class="danger">Leave room</button>
            <p id="leave-error" class="message bad" role="alert"></p>
          </div>
        </div>
        <button type="button" id="profile" class="profile-button" aria-label="Your profile" title="Your profile" hidden></button>
      </div>
    </header>

    <main>
      <h1 id="room-name">Room</h1>
      <p id="loading" class="lede">Opening room…</p>

      <div id="join" class="stack" hidden>
        <p id="join-text" class="lede"></p>
        <form id="join-form" class="card">
          <label class="field">
            <span>Your name</span>
            <input type="text" id="join-name" maxlength="20" required autocomplete="off">
          </label>
          <button type="submit">Join room</button>
          <p id="join-error" class="message bad" role="alert"></p>
          <p class="hint"><a id="join-sign-in" href="/">Already have an account on another device? Sync it</a></p>
        </form>
      </div>

      <div id="compose" class="stack" hidden>
        <p class="lede">Pass phrase</p>
        <p class="hint">Leave a phrase for others to uncover.</p>
        <form id="phrase-form" class="card">
          <label class="field">
            <span>Your phrase</span>
            <input type="text" id="phrase-text" maxlength="60" autocomplete="off" spellcheck="false" placeholder="Leave empty for a random one">
          </label>
          <div id="tokens" class="phrase" aria-live="polite" aria-label="How your phrase will be hidden"></div>
          <p id="token-note" class="hint"></p>
          <button type="submit">Start game</button>
          <p id="phrase-error" class="message bad" role="alert"></p>
        </form>
        <button type="button" id="phrase-back" class="quiet">Back to the room</button>
      </div>

      <div id="room" class="stack" hidden>
        <ul id="members" class="people" aria-label="In this room"></ul>

        <div class="share">
          <span id="share-label">Friends join this room with its code</span>
          <div>
            <button type="button" id="room-code" class="code" aria-describedby="share-label"></button>
            <button type="button" id="share-button" class="quiet" hidden>Share</button>
          </div>
        </div>

        <div id="notify" class="notify" hidden>
          <p id="notify-text"></p>
          <button type="button" id="notify-button"></button>
        </div>

        <section class="panel" aria-labelledby="games-heading">
          <h2 id="games-heading">Games</h2>
          <ul id="games" class="links"></ul>
          <p id="no-games" class="hint">No games yet.</p>
          <h2 id="new-heading">Start a new game</h2>
          <div id="modes" class="modes" role="group" aria-labelledby="new-heading">
            <button type="button" class="mode" data-mode="coop">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="8" r="3"/><circle cx="16.5" cy="9.5" r="2.4"/><path d="M2.8 19c.5-3.3 2.8-5.2 5.7-5.2s5.2 1.9 5.7 5.2M15.2 14.3c.4-.1.9-.2 1.3-.2 2.3 0 4.2 1.5 4.7 4.4"/></svg>
              <strong>Together</strong>
            </button>
            <button type="button" class="mode" data-mode="trial">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7"/><path d="M12 9.5v4l2.5 2M10 3h4M12 3v3.5M18.2 7.3l1.3-1.3"/></svg>
              <strong>Time trial</strong>
            </button>
            <button type="button" class="mode" data-mode="phrase">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15.5" r="4"/><path d="M11 12.5L20 3.5M16.5 7l2.5 2.5M14 9.5l2 2"/></svg>
              <strong>Pass phrase</strong>
            </button>
          </div>
          <p id="game-error" class="message bad" role="alert"></p>
        </section>

        <section class="panel" aria-labelledby="chat-heading">
          <h2 id="chat-heading">Chat</h2>
          <div id="chat"></div>
        </section>

      </div>
    </main>
  </template>

  <template id="screen-game">
    <header class="topbar">
      <a id="back" href="/">← correspondence.lol</a>
      <div class="top-actions">
        <!-- Start over, and a new game: only for a game played alone (postmarks/ui.js). -->
        <button type="button" id="restart" class="quiet round" aria-label="Start over" title="Start over" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12a7 7 0 1 0 2.2-5.1"/><path d="M5 4.5v4h4"/></svg>
        </button>
        <button type="button" id="new-game" class="quiet round" aria-label="New game" title="New game" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8.5v7M8.5 12h7"/></svg>
        </button>
        <div class="sound-wrap">
          <button type="button" id="sound" class="quiet round" aria-label="Sound" title="Sound" aria-haspopup="true" aria-expanded="false" aria-controls="sound-menu">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5l4.5 4v-13l-4.5 4H4z"/><path class="waves" d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/><path class="slash" d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
          </button>
          <div id="sound-menu" class="sound-menu" role="group" aria-label="Sound" hidden>
            <label class="setting"><span>Sound effects</span><input type="checkbox" role="switch" id="sound-fx"></label>
            <label class="setting"><span>Music</span><input type="checkbox" role="switch" id="sound-music"></label>
          </div>
        </div>
        <button type="button" id="help" class="quiet round" aria-label="How to play" title="How to play">?</button>
        <button type="button" id="share-game" class="quiet round" aria-label="Share this game" title="Share this game" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3.5M8 7l4-4 4 4M7 10.5H5.5v9.5h13v-9.5H17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" id="profile" class="profile-button" aria-label="Your profile" title="Your profile" hidden></button>
      </div>
    </header>

    <main>
      <!-- The rest of the map, faint, all round the board (postmarks/ui.js). -->
      <div class="map-far game-map" aria-hidden="true" hidden></div>
      <h1 class="sr-only">Postmarks</h1>
      <p id="loading" class="lede" hidden>Opening game…</p>

      <div id="trial" class="stack" hidden>
        <p id="trial-title" class="lede">Time trial</p>
        <p id="trial-hint" class="hint"></p>
        <div id="trial-phrase" class="phrase" hidden></div>
        <ol id="trial-runs" class="runs"></ol>
        <div class="row">
          <button type="button" id="trial-start" class="go">Start</button>
          <button type="button" id="trial-share" class="quiet">Share this game</button>
        </div>
        <p id="trial-error" class="message bad" role="alert"></p>
      </div>

      <div id="play" class="stack" hidden>
        <div class="hud">
          <p id="turn" class="turn"></p>
          <p class="tallies">
            <span id="hearts"></span>
            <span id="found"></span>
          </p>
        </div>

        <ul id="roster" class="people roster" aria-label="Players" hidden></ul>

        <div id="phrase" class="phrase" hidden></div>
        <p id="phrase-note" class="hint" hidden></p>

        <div id="board" class="board" role="group" aria-label="Puzzle grid"></div>

        <p id="hint-note" class="hint-note" role="status" hidden></p>
        <div class="toolbar">
          <!-- A tap crosses a square and a double tap opens it, so there is nothing to switch between; only the pass phrase has a button of its own. -->
          <div id="tools" class="tools">
            <button type="button" data-tool="phrase" aria-pressed="false" hidden>
              <span class="glyph" aria-hidden="true">Aa</span> Phrase
            </button>
          </div>
          <button type="button" id="chat-toggle" class="hint-button chat-button" aria-label="Room chat" title="Room chat" aria-expanded="false" aria-controls="chat-box" hidden>
            <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6.5h14v9.5H11l-4 3.2V16H5z"/></svg>
            <span id="chat-count" class="count" hidden></span>
          </button>
          <button type="button" id="hint" class="hint-button" aria-label="Hint" title="Hint">
            <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17.5h6M10 20.5h4M8.2 14.2A6 6 0 1 1 15.8 14.2c-.6.6-.9 1.3-.9 2.1v1.2H9.1v-1.2c0-.8-.3-1.5-.9-2.1z"/></svg>
          </button>
          <button type="button" id="submit" class="go" disabled hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Submit
          </button>
        </div>
        <form id="phrase-entry" class="row phrase-entry" hidden>
          <input type="text" id="phrase-input" maxlength="60" autocomplete="off" autocapitalize="off" spellcheck="false"
                 placeholder="Type the whole phrase" aria-label="Your guess at the phrase" required>
          <button type="submit">Guess</button>
        </form>
        <p id="narration" class="sr-only" role="status" aria-live="polite"></p>
        <p id="message" class="message bad" role="alert"></p>

        <div id="lost-choice" class="row lost-choice" hidden>
          <button type="button" id="reveal-run" class="quiet">Reveal the phrase</button>
          <button type="button" id="retry-run" class="go">Try again</button>
        </div>
        <ol id="runs" class="runs" hidden></ol>

        <details id="chat-box" class="panel" hidden>
          <summary>Room chat <span id="chat-unread"></span></summary>
          <div id="chat"></div>
        </details>
      </div>

    </main>
  </template>

  <template id="screen-jam">
    <header class="topbar">
      <a href="/">← correspondence.lol</a>
    </header>

    <main>
      <h1>Loops</h1>
      <div class="jam">
        <p id="jam-hint" class="jam-hint">Tap the tiles, or drag across them. It plays round and round.</p>
        <div id="jam-board" class="jam-board" role="group" aria-label="The loop: eight steps across, seven notes high"></div>
        <div id="jam-layers" class="jam-layers" role="radiogroup" aria-label="Instrument"></div>
        <div class="jam-controls">
          <div class="side">
            <button type="button" id="jam-tempo" class="quiet" aria-label="Tempo" title="Tempo"></button>
            <button type="button" id="jam-dice" class="quiet" aria-label="Surprise me" title="Surprise me">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3.5"/><circle cx="8.6" cy="8.6" r="1.1" fill="currentColor"/><circle cx="15.4" cy="15.4" r="1.1" fill="currentColor"/><circle cx="12" cy="12" r="1.1" fill="currentColor"/></svg>
            </button>
          </div>
          <button type="button" id="jam-play" aria-label="Play" aria-pressed="false">
            <svg class="go-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6l11-6.8z" fill="currentColor"/></svg>
            <svg class="pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5.5h3.6v13H7zM13.4 5.5H17v13h-3.6z" fill="currentColor"/></svg>
          </button>
          <div class="side">
            <button type="button" id="jam-clear" class="quiet" aria-label="Clear this instrument" title="Clear this instrument">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14M10 7V5h4v2M7 7l.8 12h8.4L17 7M10.3 10.5v5M13.7 10.5v5"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>
  </template>

  <template id="screen-office">
    <!-- Scene one: the Dead Letter Office. No words: see penny/office.js. -->
    <main class="office">
      <!-- The one thing here that is not the scene: a door, to the rooms and the friends in them. -->

      <button type="button" id="walk-trail" class="walk-trail" aria-label="The sound Penny is looking for, as far as it has been heard" hidden></button>
      <p id="walk-feeling" class="sr-only" role="status"></p>
      <div class="walk-ground">
        <div class="map-far walk-map" aria-hidden="true"></div>
        <div class="walk-light" aria-hidden="true"></div>
        <div id="walk-known" class="walk-known" aria-hidden="true"></div>
        <div id="walk-board" class="board walk-board" role="group" aria-label="A place on the map"></div>
        <button type="button" id="walk-portal" class="portal" aria-label="On to the next place" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#envelope"/></svg></button>
      </div>
    </main>
  </template>
